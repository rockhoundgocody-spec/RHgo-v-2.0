# Frontend CI. The Deno workflow (deno.yml) covers the Base44 backend functions;
# this one covers the React app, which previously had no automated gate at all.

# Actions are pinned to commit SHAs (the trailing comment names the release), so CI only
# runs action code that was reviewed here. To update, move every pin to the same new release.
# The runner image is pinned to ubuntu-24.04 instead of ubuntu-latest, which GitHub starts moving
# to Ubuntu 26 on 2026-10-19. Move to ubuntu-26.04 on purpose, after a green run there.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Tooling tests (type-error ratchet)
        run: npm run test:scripts

      - name: Production build
        run: npm run build

  typecheck:
    # One-way ratchet: the existing type-error backlog is recorded in
    # .github/typecheck-baseline.json and may only go down. See
    # scripts/typecheck-ratchet.mjs.
    name: Type-error ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Check type errors against baseline
        run: npm run typecheck:ratchet
