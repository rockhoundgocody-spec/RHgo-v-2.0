<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP as a meta tag (Base44 hosting can't send response headers): HTTPS-only sources,
         no plugins/<object>, no <base> hijacking, forms post only to HTTPS.
         frame-ancestors/HSTS need real headers from the host (see Caddyfile for self-hosting). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.base44.app https://*.base44.com https://media.base44.com https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com https://macrostrat.org https://tiles.macrostrat.org wss:; media-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self' https:" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RockHound GO" />

    <!-- Safe-by-default: every URL is served this same index.html, so the raw HTML
         must carry noindex,nofollow for crawlers and preview fetchers that don't run JS.
         src/lib/routeSeo.js flips this to "index, follow" after render for the public
         sitemap pages only (Google renders JS, so those stay indexable). -->
    <meta name="robots" content="noindex, nofollow" id="robots-meta" />
    <!-- Optional: set VITE_GSC_VERIFICATION in env to inject google-site-verification at runtime -->
    <meta name="description" content="Explore possible mineral matches from a photo, check access guidance before collecting, and keep a personal collection with RockHound GO." />
    <meta name="keywords" content="rockhounding, mineral identification, geology app, crystal collecting, AI rock ID, rock identifier, mineral scanner, geology field app" />
    <!-- Canonical is set per route by src/lib/routeSeo.js (one static tag would point every URL at the homepage). -->

    <!-- Open Graph / Social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RockHound GO" />
    <meta property="og:url" content="https://rhgo.me/" />
    <meta property="og:title" content="RockHound GO — AI Field Companion for Rockhounds" />
    <meta property="og:description" content="Explore possible mineral matches, visible clues, and field tests. Try a guest scan with RockHound GO." />
    <meta property="og:image" content="https://media.base44.com/images/public/69f35dd14650b54681c835ec/d14952ce3_generated_image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RockHound GO — AI mineral identification and field companion" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RockHound GO — AI Field Companion for Rockhounds" />
    <meta name="twitter:description" content="Explore possible mineral matches, visible clues, and field tests. Try a guest scan with RockHound GO." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/69f35dd14650b54681c835ec/d14952ce3_generated_image.png" />

    <link rel="manifest" href="/manifest.json" />
    <title>RockHound GO — AI Rock &amp; Mineral ID for Rockhounds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
